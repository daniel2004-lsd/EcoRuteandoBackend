name: Keep Alive (evita cold start en Render)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Enviando ping a Render..."
          curl -s -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            --max-time 30 \
            https://ecoruteandobackend.onrender.com/api/auth/me
