# Render Blueprint: Web Service del backend EcoRuteando (.NET 9).
# Builda desde el Dockerfile del repo y se conecta al Render Postgres vinculado.
services:
  - type: web
    name: ecoruteando-backend
    runtime: docker
    dockerfilePath: ./dockerfile
    # El Dockerfile builda desde la raíz con optimización de caché multi-etapa
    dockerContext: .
    healthCheckPath: /health
    # Puerto del contenedor: 5124 unificado con dockerfile y docker-compose.
    envVars:
      # Render asigna el puerto de forma dinámica; ASP.NET Core lo lee de $PORT si se define.
      - key: ASPNETCORE_URLS
        value: http://+:5124
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Cadena de conexión al Render Postgres vinculado (se inyecta automáticamente
      # al vincular la BD a este servicio en el dashboard).
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: ecoruteando-db
          property: connectionString
      # El resto de secretos se definen como "Secret" en el dashboard de Render
      # (sync: false) para que no se commiteen: Jwt__SecretKey, Admin__Password,
      # Google__*, EmailSettings__Password, GoogleMaps__ApiKey, etc.
      - key: Jwt__SecretKey
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: GoogleMaps__ApiKey
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: EmailSettings__Password
        sync: false
